name: Minimal tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: R core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::.
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: false
      - name: Install local package
        run: R CMD INSTALL .
      - name: Run minimal core tests
        run: Rscript --vanilla tests/test-core.R
